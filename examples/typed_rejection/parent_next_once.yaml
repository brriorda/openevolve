# One-shot parent feedback variant of the typed rejection example.
# From the OpenEvolve repository root after `pip install -e .`, run:
#   python openevolve-run.py examples/typed_rejection/initial_program.py \
#     examples/typed_rejection/evaluator.py \
#     --config examples/typed_rejection/parent_next_once.yaml --iterations 8 \
#     --output typed_rejection_parent_feedback_output
# A rejected proposal is excluded; its diagnosis reaches one later proposal
# only when the same admitted parent is selected again.

max_iterations: 8
checkpoint_interval: 4
diff_based_evolution: true

llm:
  models:
    - name: gpt-4o-mini
      weight: 1.0

prompt:
  system_message: >
    Improve the square(value) function so its numeric output is close to
    value * value for positive and negative inputs. Preserve the required
    top-level function name and one-argument interface.

database:
  num_islands: 1

evaluator:
  parallel_evaluations: 1

rejection_memory:
  policy: parent_next_once
  store: run_directory
  feedback_recent_k: 1
  penalty_score: 0.0
