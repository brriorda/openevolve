# Categorical exclusion variant of the typed rejection example.
# From the OpenEvolve repository root, run:
#   python openevolve-run.py examples/typed_rejection/initial_program.py \
#     examples/typed_rejection/evaluator.py \
#     --config examples/typed_rejection/discard_only.yaml --iterations 8 \
#     --output typed_rejection_discard_output
# This matches config.yaml except for rejection_memory.policy.

max_iterations: 8
checkpoint_interval: 4
diff_based_evolution: true

llm:
  models:
    - name: gpt-4o-mini
      weight: 1.0

prompt:
  system_message: >
    Improve the square(value) function so its numeric output is close to
    value * value for positive and negative inputs. Preserve the required
    top-level function name and one-argument interface.

database:
  num_islands: 1

evaluator:
  parallel_evaluations: 1

rejection_memory:
  policy: discard_only
  store: run_directory
  penalty_score: 0.0
